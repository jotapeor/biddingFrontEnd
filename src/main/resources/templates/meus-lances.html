<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EditaisGOV - Meus Lances</title>
    <link rel="icon" type="image/png" th:href="@{/edital-icon.png}">
    <th:block th:replace="~{layout :: head-content}"></th:block>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{layout :: navbar}"></div>

<div class="container mt-4 flex-grow-1">

    <!-- Cabeçalho -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/editais}" class="btn btn-outline-secondary btn-sm shadow-sm">&larr; Editais</a>
            <h1 class="h2 text-primary mb-0">Meus Lances</h1>
        </div>
    </div>

    <!-- Tabela de Lances -->
    <div class="card shadow-sm">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0 text-dark">Histórico Pessoal</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0 align-middle">
                    <thead class="table-light">
                    <tr>
                        <th scope="col" class="px-4">Edital</th>
                        <th scope="col">Status do Edital</th>
                        <th scope="col">Data do Lance</th>
                        <th scope="col">Valor (R$)</th>
                        <th scope="col" class="text-center">Resultado</th>
                    </tr>
                    </thead>
                    <tbody>

                    <tr th:each="lance : ${lances}">
                        <td class="px-4">
                            <a th:href="@{/editais/{id}(id=${lance.idEdital})}"
                               class="text-decoration-none fw-bold"
                               th:text="${lance.tituloEdital}">
                            </a>
                            <div class="small text-muted" th:text="'ID: #' + ${lance.idEdital}"></div>
                        </td>

                        <td>
                            <span class="badge px-2 py-1"
                                  th:classappend="${lance.statusEdital == 'ABERTO'} ? 'bg-success' : 'bg-secondary'"
                                  th:text="${lance.statusEdital}">
                            </span>
                        </td>

                        <td th:text="${lance.dataLanceFormatada}"></td>

                        <td class="text-success fw-bold fs-6">
                            R$ <span th:text="${#numbers.formatDecimal(lance.valor, 1, 'POINT', 2, 'COMMA')}"></span>
                        </td>

                        <td class="text-center">
                            <span th:if="${lance.statusEdital == 'ABERTO'}" class="text-muted small">
                                Aguardando encerramento
                            </span>
                            <span th:if="${lance.statusEdital != 'ABERTO' and lance.vencedor}"
                                  class="badge bg-warning text-dark px-3 py-2 fs-6 shadow-sm border border-warning">
                                🏆 VENCEDOR
                            </span>
                            <span th:if="${lance.statusEdital != 'ABERTO' and !lance.vencedor}"
                                  class="badge bg-danger px-3 py-2 shadow-sm border border-danger opacity-75">
                                Não ganhou
                            </span>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(lances)}">
                        <td colspan="5" class="text-center py-5 text-muted">
                            <h5 class="fw-normal mb-1">Você ainda não enviou nenhum lance.</h5>
                            <p class="small mb-0">Participe de editais abertos para que eles apareçam aqui.</p>
                        </td>
                    </tr>

                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<div th:replace="~{layout :: footer}"></div>

<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
