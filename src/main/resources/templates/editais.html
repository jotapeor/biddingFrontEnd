<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Editais</title>
    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2 text-primary mb-0">Lista de Editais</h1>
        <div>
            <a th:if="${role == 'COMPRADOR'}" th:href="@{/novo-edital}" class="btn btn-success shadow-sm">
                + Criar Novo Edital
            </a>
            <a th:href="@{/logout}" class="btn btn-outline-danger ms-2 shadow-sm">Logout</a>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/editais}" method="get" class="row g-3 align-items-center">
                <div class="col-auto">
                    <div class="form-check form-switch mt-2">
                        <input class="form-check-input" type="checkbox" role="switch" name="urgente" value="true"
                               id="urgenteCheck" th:checked="${urgente}"/>
                        <label class="form-check-label fw-bold text-danger" for="urgenteCheck">
                            Mostrar apenas urgentes (ABERTOS fechando em 48h)
                        </label>
                    </div>
                </div>
                <div class="col-auto ms-auto">
                    <button type="submit" class="btn btn-primary btn-sm px-3">Filtrar</button>
                    <button type="button" class="btn btn-secondary btn-sm px-3 ms-2"
                            th:onclick="'window.location.href=\'' + @{/editais} + '\'; return false'">Limpar Filtros
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0 align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th scope="col" class="px-3">ID</th>
                        <th scope="col">Título</th>
                        <th scope="col">Descrição</th>
                        <th scope="col">Data de Fechamento</th>
                        <th scope="col">Status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="edital : ${editais}">
                        <td class="px-3 fw-bold" th:text="${edital.id}"></td>
                        <td th:text="${edital.titulo}"></td>
                        <td class="text-muted" th:text="${edital.descricao}"></td>
                        <td th:text="${edital.dataFechamentoFormatada}"></td>
                        <td>
                            <span class="badge bg-primary" th:text="${edital.status}"></span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(editais)}">
                        <td colspan="5" class="text-center py-4 text-muted">Nenhum edital encontrado.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
