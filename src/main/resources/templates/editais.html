<!DOCTYPE html>
<!-- Página de listagem de editais: exibe todos os editais com filtro de urgência. -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EditaisGOV - Lista</title>
    <link rel="icon" type="image/png" th:href="@{/edital-icon.png}">
    <th:block th:replace="~{layout :: head-content}"></th:block>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<!-- Navbar do layout global -->
<div th:replace="~{layout :: navbar}"></div>

<div class="container mt-4 flex-grow-1">

    <!-- Mensagens de feedback vindas via RedirectAttributes (flash attributes) do controller. -->
    <!-- th:if="${mensagemSucesso}": renderiza somente quando o atributo existe no model. -->
    <!-- alert-dismissible + data-bs-dismiss="alert": permite fechar o alerta pelo botão X. -->
    <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <strong>Sucesso!</strong> <span th:text="${mensagemSucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <strong>Atenção:</strong> <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2 text-primary mb-0">Sistema de Editais</h1>
        <!-- Botão "Novo Edital" visível apenas para quem não é FORNECEDOR (ex: ORGAO). -->
        <!-- th:if="${role != 'FORNECEDOR'}": role foi adicionada ao model pelo EditalController. -->
        <!-- th:href="@{/novo-edital}": URL gerada pelo Thymeleaf considerando o context path. -->
        <a th:if="${role != 'FORNECEDOR'}" th:href="@{/novo-edital}" class="btn btn-success shadow-sm">
            &#43; Novo Edital
        </a>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h5 class="mb-0 text-dark">Editais Disponíveis</h5>

            <!-- Formulário de filtro por urgência. -->
            <!-- method="get": envia o filtro como query string (?urgente=on). -->
            <form th:action="@{/editais}" method="get" class="d-flex align-items-center m-0">
                <div class="form-check form-switch me-3">
                    <!-- th:checked="${param.urgente != null}": marca o checkbox se o parâmetro existir na URL. -->
                    <input class="form-check-input" type="checkbox" role="switch" id="urgenteSwitch" name="urgente"
                           th:checked="${param.urgente != null}">
                    <label class="form-check-label text-danger fw-bold" for="urgenteSwitch">Apenas Urgentes</label>
                </div>
                <button type="submit" class="btn btn-sm btn-outline-secondary">Filtrar</button>
            </form>
        </div>

        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0 align-middle">
                    <thead class="table-light">
                    <tr>
                        <th scope="col" class="px-4"># ID</th>
                        <th scope="col">Título do Edital</th>
                        <th scope="col">Data de Fechamento</th>
                        <th scope="col">Status</th>
                        <th scope="col" class="text-end px-4">Ação</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- th:each="edital : ${editais}": itera sobre a lista de EditalDTO passada pelo controller. -->
                    <tr th:each="edital : ${editais}" class="card-hover">
                        <!-- th:text="${edital.id}": acessa a propriedade id do EditalDTO via getter -->
                        <th scope="row" class="px-4 text-muted" th:text="${edital.id}">1</th>
                        <td class="fw-semibold text-dark" th:text="${edital.titulo}">Título</td>
                        <td>
                            <!-- data-time: atributo customizado com o valor bruto para ser lido pelo JavaScript. -->
                            <!-- th:text="${edital.dataFechamentoFormatada}": chama método que retorna "dd/MM/yyyy HH:mm". -->
                            <span class="data-fechamento" th:attr="data-time=${edital.dataFechamento}"
                                  th:text="${edital.dataFechamentoFormatada}"></span>
                        </td>
                        <td>
                            <!-- th:classappend: adiciona dinamicamente uma classe CSS ao elemento. -->
                            <span class="badge px-2 py-1"
                                  th:classappend="${edital.status == 'ABERTO'} ? 'bg-success' : 'bg-secondary'"
                                  th:text="${edital.status}">
                            </span>
                            <!-- Badge de urgência, inicialmente oculto com d-none. -->
                            <!-- th:id="'badge-urgent-' + ${edital.id}": gera IDs únicos por linha. -->
                            <span class="badge bg-danger ms-1 badge-urgent d-none"
                                  th:id="'badge-urgent-' + ${edital.id}">Encerrando em breve!</span>
                        </td>
                        <td class="text-end px-4">
                            <!-- th:href="@{/editais/{id}(id=${edital.id})}": sintaxe Thymeleaf para URLs com variáveis de path. -->
                            <a th:href="@{/editais/{id}(id=${edital.id})}"
                               class="btn btn-primary btn-sm px-3 shadow-sm">
                                Ver Detalhes
                            </a>
                        </td>
                    </tr>
                    <!-- Linha exibida apenas quando a lista está vazia. -->
                    <tr th:if="${#lists.isEmpty(editais)}">
                        <td colspan="5" class="text-center py-5 text-muted">
                            Nenhum edital encontrado no momento.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout :: footer}"></div>

<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
<script>
    // Script de urgência: exibe o badge "Encerrando em breve!" nos editais que fecham nas próximas 48 horas.
    document.addEventListener("DOMContentLoaded", function () {
        // Seleciona todos os elementos que possuem a classe .data-fechamento
        const rows = document.querySelectorAll('.data-fechamento');
        const now = new Date().getTime(); // Timestamp atual em milissegundos
        const limit = 48 * 60 * 60 * 1000; // 48 horas convertidas para milissegundos

        rows.forEach(function (row) {
            // Lê o atributo data-time injetado pelo Thymeleaf com o LocalDateTime bruto
            const timeStr = row.getAttribute('data-time');
            if (timeStr) {
                // Converte a string de data para timestamp
                const closeDate = new Date(timeStr).getTime();
                const diff = closeDate - now; // Diferença em ms entre o fechamento e agora

                // Só exibe o badge se o edital ainda não fechou (diff > 0) e fecha em < 48h
                if (diff > 0 && diff < limit) {
                    // Localiza o badge de urgência na mesma linha (<tr>) pelo ID único
                    const id = row.closest('tr').querySelector('.badge-urgent').id;
                    document.getElementById(id).classList.remove('d-none'); // Torna o badge visível
                }
            }
        });
    });
</script>
</body>
</html>
