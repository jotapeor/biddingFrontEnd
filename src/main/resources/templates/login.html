<!doctype html>
<!-- Página de login: formulário de autenticação com validação server-side. -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>EditaisGOV</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" type="image/png" th:href="@{/edital-icon.png}">
    <th:block th:replace="~{layout :: head-content}"></th:block>

</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{layout :: navbar}"></div>

<div class="container my-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4 text-primary">EditaisGOV</h2>

                    <!-- Exibido quando o redirect do /registrar traz mensagemSucesso via flash attribute. -->
                    <div th:if="${mensagemSucesso}" class="alert alert-success" role="alert"
                         th:text="${mensagemSucesso}"></div>

                    <!-- Erro vindo do backend exibido no topo do form -->
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm"
                         role="alert">
                        <strong>Erro!</strong> <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
                    </div>

                    <!-- th:action="@{/logar}": define a URL de destino do POST, resolvida pelo Thymeleaf. -->
                    <!-- th:object="${credenciais}": vincula o formulário ao objeto UserRequestDTO do model. -->
                    <form th:action="@{/logar}" th:object="${credenciais}" method="post" id="formLogin" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="email" name="email"
                                   th:value="${credenciais?.email}"
                                   autocomplete="email" required
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
                            <div class="invalid-feedback fw-bold" th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="senha" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="senha" name="senha"
                                   autocomplete="current-password" required
                                   th:classappend="${#fields.hasErrors('senha')} ? 'is-invalid'"/>
                            <div class="invalid-feedback fw-bold" th:if="${#fields.hasErrors('senha')}"
                                 th:errors="*{senha}"></div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg" id="btn-logar">Logar</button>
                        </div>
                        <div class="text-center mt-3">
                            <a class="text-decoration-none" th:href="@{/registrar}">Não tem uma conta? Registre-se</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>

<div th:replace="~{layout :: footer}"></div>

</body>
</html>
