<!DOCTYPE html>
<!-- Formulário de cadastro de novo usuário (FORNECEDOR). -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>EditaisGOV</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" th:href="@{/edital-icon.png}">
    <th:block th:replace="~{fragments/layout :: head-content}"></th:block>

</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container my-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4 text-primary">Cadastrar nova conta</h2>

                    <!-- Erro vindo do backend exibido no topo do form -->
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm"
                         role="alert">
                        <strong>Erro!</strong> <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
                    </div>

                    <!-- th:action="@{/registrar}": destino do POST. -->
                    <!-- th:object="${user}": vincula ao UserDTO do model para uso de th:value com safe-navigation. -->
                    <!-- Sem novalidate: usa validação nativa do browser (type, required, minlength, pattern). -->
                    <form th:action="@{/registrar}" th:object="${user}" method="post" id="formCadastro" novalidate>

                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <!-- minlength="3" e required: validação nativa do browser, sem JavaScript. -->
                            <input type="text" class="form-control" id="nome" name="nome"
                                   th:value="${user?.nome}" autocomplete="name"
                                   required minlength="3" th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"/>
                            <div class="invalid-feedback fw-bold" th:if="${#fields.hasErrors('nome')}"
                                 th:errors="*{nome}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <!-- type="email" e required: validação nativa do browser, sem JavaScript. -->
                            <input type="email" class="form-control" id="email" name="email"
                                   th:value="${user?.email}" autocomplete="email" required
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
                            <div class="invalid-feedback fw-bold" th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="senha" class="form-label">Senha</label>
                            <!-- pattern: validação nativa - mínimo 8 chars, 1 maiúscula, 1 número, 1 especial. -->
                            <!-- Campo senha sem botão de toggle (sem JavaScript). -->
                            <input type="password" class="form-control" id="senha" name="senha"
                                   autocomplete="new-password" required
                                   minlength="8"
                                   pattern="^(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&amp;*(),.?&quot;:{}|&lt;&gt;_\-=\[\]]).{8,}$"
                                   title="Mínimo 8 caracteres, uma maiúscula, um número e um caractere especial."
                                   th:classappend="${#fields.hasErrors('senha')} ? 'is-invalid'"/>
                            <div class="invalid-feedback fw-bold" th:if="${#fields.hasErrors('senha')}"
                                 th:errors="*{senha}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmarSenha" class="form-label">Confirmar Senha</label>
                            <!-- Campo confirmar senha sem botão de toggle (sem JavaScript). -->
                            <!-- A confirmação server-side valida se as senhas coincidem via UserService. -->
                            <input type="password" class="form-control" id="confirmarSenha" name="confirmarSenha"
                                   autocomplete="new-password" required minlength="8"
                                   th:classappend="${#fields.hasErrors('confirmarSenha')} ? 'is-invalid'"/>
                            <div class="invalid-feedback fw-bold" th:if="${#fields.hasErrors('confirmarSenha')}"
                                 th:errors="*{confirmarSenha}"></div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg" id="btn-cadastrar">Cadastrar</button>
                        </div>
                        <div class="text-center mt-3">
                            <a class="text-decoration-none" th:href="@{/login}">Já tem uma conta? Faça login</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
