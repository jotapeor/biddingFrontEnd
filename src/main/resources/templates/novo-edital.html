<!DOCTYPE html>
<!-- Formulário de criação de novo edital, acessível apenas para usuários com role ORGAO. -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EditaisGOV - Novo Edital</title>
    <link rel="icon" type="image/png" th:href="@{/edital-icon.png}">
    <th:block th:replace="~{fragments/layout :: head-content}"></th:block>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<!-- Navbar do layout global -->
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container mt-4 flex-grow-1">

    <!-- Mensagem de sucesso vinda via flash attribute após criação bem-sucedida -->
    <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <span th:text="${mensagemSucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>

    <!-- Erro exibido como alerta Bootstrap descartável -->
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <strong>Atenção!</strong> <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/editais}" class="btn btn-outline-secondary btn-sm shadow-sm">&larr; Editais</a>
            <h1 class="h2 text-success mb-0">Criar Novo Edital</h1>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <!-- th:action="@{/novo-edital}": URL do POST de criação, mapeada pelo @PostMapping do EditalController. -->
            <!-- th:object="${editalDTO}": vincula o formulário ao EditalDTO do model. -->
            <!-- novalidate: desabilita a validação nativa do browser. -->
            <form th:action="@{/novo-edital}" method="post" th:object="${editalDTO}" id="formNovoEdital">

                <div class="mb-3">
                    <label for="titulo" class="form-label fw-bold">Título do Edital</label>
                    <!-- th:field="*{titulo}": gera id="titulo", name="titulo" e vincula o input ao campo do objeto. -->
                    <input type="text" class="form-control form-control-lg" id="titulo" name="titulo"
                           th:field="*{titulo}" placeholder="Ex: Aquisição de Computadores"
                           th:classappend="${#fields.hasErrors('titulo')} ? 'is-invalid'">
                    <div class="invalid-feedback fw-bold" th:if="${#fields.hasErrors('titulo')}"
                         th:errors="*{titulo}"></div>
                </div>

                <div class="mb-3">
                    <label for="descricao" class="form-label fw-bold">Descrição</label>
                    <!-- textarea com th:field: vincula ao campo descricao do EditalDTO. -->
                    <textarea class="form-control" id="descricao" name="descricao" rows="4"
                              th:field="*{descricao}"
                              placeholder="Detalhes completos sobre o objeto da licitação..."
                              th:classappend="${#fields.hasErrors('descricao')} ? 'is-invalid'"></textarea>
                    <div class="invalid-feedback fw-bold" th:if="${#fields.hasErrors('descricao')}"
                         th:errors="*{descricao}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="dataFechamento" class="form-label fw-bold">Data e Hora de Fechamento</label>
                        <!-- type="datetime-local": input nativo HTML5 que exibe um seletor de data e hora. -->
                        <input type="datetime-local" class="form-control" id="dataFechamento"
                               th:field="*{dataFechamento}"
                               th:classappend="${#fields.hasErrors('dataFechamento')} ? 'is-invalid'">
                        <div class="invalid-feedback fw-bold" th:if="${#fields.hasErrors('dataFechamento')}"
                             th:errors="*{dataFechamento}"></div>
                    </div>
                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-success shadow-sm px-4" id="btn-salvar">Salvar Edital</button>
                </div>
            </form>
        </div>
    </div>

</div>

<div th:replace="~{fragments/layout :: footer}"></div>

<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
